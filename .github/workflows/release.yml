name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git describe resolves the tag

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Use example secrets as build defaults
        run: cp include/secrets.h.example include/secrets.h

      - name: Build firmware
        run: pio run

      - name: Stage OTA binary
        run: cp .pio/build/m5stack-atoms3/firmware.bin atom-plane-tracker-${{ github.ref_name }}.bin

      - name: Create merged initial-flash binary
        run: |
          BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null | head -1)
          python -m esptool --chip esp32s3 merge_bin \
            --output atom-plane-tracker-${{ github.ref_name }}-initial-flash.bin \
            0x0000 .pio/build/m5stack-atoms3/bootloader.bin \
            0x8000 .pio/build/m5stack-atoms3/partitions.bin \
            0xE000 "$BOOT_APP0" \
            0x10000 .pio/build/m5stack-atoms3/firmware.bin

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            atom-plane-tracker-${{ github.ref_name }}.bin
            atom-plane-tracker-${{ github.ref_name }}-initial-flash.bin
          generate_release_notes: true
